default_provider = "anthropic"

# Optional: extra instructions added to the built-in system prompt (which already gives the model
# the current date and the rules for using tools). Must stay above the first [section].
# system_prompt = """
# Our office is in Belgium (Europe/Brussels time zone).
# """

[server]
host = "0.0.0.0"
port = 8787

# Optional: serve HTTPS directly using a cert from Let's Encrypt (via deploy/tls/request-cert.sh).
# Off by default (plain HTTP). See deploy/tls/README.md.
[tls]
enabled = false
cert_path = "/etc/letsencrypt/live/your-hostname/fullchain.pem"
key_path = "/etc/letsencrypt/live/your-hostname/privkey.pem"

# Optional: how hard the AI works on one question when tools are ticked. These are the defaults.
[agent]
# Model requests per question, tool calls included. More = deeper investigations, higher cost.
max_turns = 40
# When the AI gives its answer, ask it once whether anything is still open that the tools could
# resolve. If so it continues, and the UI shows "Completion check: following up on open points".
completion_check = true
# Output token limit per request (Claude only; OpenAI and Mistral use the model's own limit).
# Claude's thinking counts towards it; you only pay for what is actually generated.
max_output_tokens = 64000
# Size cap per tool result, in characters. Log rows cost about 1 token per 1.7 characters, so
# 20000 is roughly 12k tokens. Bigger results are cut and the AI is told to narrow its query.
max_tool_result_chars = 20000
# Before any tool call, the AI writes a numbered investigation plan (shown at the top of its
# reply), then carries it out. One extra request per question; helps weaker models a lot.
plan_first = true

[providers.anthropic]
api_key = "sk-ant-REPLACE-ME"
default_model = "claude-opus-5-5"
# How hard Claude works per step: low | medium | high | xhigh | max. Opus 5.5's own default is only
# "medium"; investigations want "high". Higher = better answers, more tokens. Don't set
# `temperature` here: current Claude models reject it.
effort = "high"
# Show a readable summary of Claude's thinking, folded under each reply. Default true. Off, Claude
# still thinks (and bills the same), but the UI has nothing to show.
# show_thinking = true

[providers.openai]
api_key = "sk-REPLACE-ME"
default_model = "gpt-4.1"

[providers.mistral]
api_key = "REPLACE-ME"
default_model = "mistral-large-latest"
# Optional, any provider: lower = steadier tool use. Unset = the provider's default. Don't set it
# for OpenAI reasoning models, which reject it.
temperature = 0.2

# Optional: MCP servers whose tools get made available to the model (anthropic, openai, mistral).
# Each entry's key becomes the tool name prefix, e.g. "fortianalyzer" + tool "get_alerts" is
# exposed to the model as "fortianalyzer__get_alerts". Add as many [mcp.<name>] blocks as you like.
[mcp.fortianalyzer]
url = "https://REPLACE-WITH-YOUR-MCP-URL/mcp"
bearer_token = "REPLACE-ME"
# Every tool's description is sent with every request (73 FortiAnalyzer tools = roughly 30k
# tokens), so offering fewer leaves more room for actual data. Names are the server's own tool
# names, without the "fortianalyzer__" prefix. Omit include_tools to offer every tool.
# include_tools = [
#   "get_alerts", "get_alert_details", "get_alert_logs", "get_incidents", "get_incident",
#   "query_logs", "fetch_more_logs", "search_ips_logs", "get_log_fields", "get_fortiview_data",
#   "list_devices", "search_devices", "get_endpoints", "get_endusers",
#   "get_indicator_enrichment", "get_system_status", "list_adoms",
# ]
# Your own notes for the AI about this server, added to its instructions whenever the server is
# ticked (after the guide the MCP server itself sends at connection). Use it for what the AI keeps
# getting wrong. These come from real investigations:
notes = """
- In traffic logs of DNS sessions (dstport 53), `hostname` is the name the client looked up, not
  the name of the destination server. Traffic logs carry no reliable name for the destination.
- group_by is refused together with a dstport filter. Use sample_by instead (a bounded sample of
  up to 1000 logs), then exclude what you found and re-query until nothing new appears.
- `limit` is capped at 1000.
- Total counts over long windows are unreliable (two queries can disagree): use them to compare,
  never as exact figures.
- list_devices / get_device_info list the devices that send logs to FortiAnalyzer (firewalls,
  syslog sources), not an asset or Active Directory inventory.
- `devname` is the firewall that logged the traffic, i.e. the site.
- To know what a machine serves, exclude action=deny: blocked scanners hit every port.
"""
# Never offered to the model: the tools that change things on the FortiAnalyzer.
exclude_tools = [
  "add_device", "add_devices_bulk", "delete_device", "delete_devices_bulk",
  "create_incident", "update_incident", "acknowledge_alerts", "unacknowledge_alerts",
  "acknowledge_ioc_events", "add_alert_comment", "update_api_ratelimit",
]

# Optional: external threat intelligence on public IPs and domains, as the "intel" tool (a
# checkbox under Tools in the UI) and as hover cards on every IP/domain in the answers.
# PUBLIC IPs and domains are sent to these services; private ranges and internal_domains never are.
# RDAP (owner, network, country, domain age) needs no key. Each other source is used once its key
# is set; all three have free plans.
[intel]
enabled = true
# https://www.abuseipdb.com/account/api : abuse score, report categories (brute force, scan...)
abuseipdb_api_key = ""
# https://www.virustotal.com/gui/my-apikey : antivirus / blocklist detections
virustotal_api_key = ""
# The free VirusTotal API allows 4 lookups a minute; lookups beyond that are skipped.
virustotal_per_minute = 4
# https://otx.alienvault.com/settings : threat reports, campaigns and malware families
otx_api_key = ""
# Your own domains, never looked up. .local .lan .internal .corp .home .arpa are always internal.
internal_domains = ["example.local"]
# How long a result is reused before asking the services again.
cache_hours = 24

# Open WebUI as the tool (deploy/openwebui/README.md): LASEASK serves it the MCP tools on POST /mcp
# (every [mcp.*] server with include_tools / exclude_tools / notes, result compaction per [agent]
# max_tool_result_chars, plus "intel"). Open WebUI has the models and their keys, so in this mode
# default_provider and [providers.*] can be left out entirely.
[tool_server]
enabled = false
# Bearer token of Open WebUI's MCP connection (Admin Panel > Settings > External Tools). At least
# 16 characters: openssl rand -hex 32
api_key = "REPLACE-ME-WITH-A-LONG-RANDOM-SECRET"
# Which servers to offer. Unset = every [mcp.*] server plus "intel".
# servers = ["fortianalyzer", "intel"]

# Legacy (kept for now): Open WebUI calling LASEASK's own agent as a model. Open WebUI then keeps
# the users, conversations, knowledge bases, notes, channels and usage statistics, and sees each
# [[openwebui.models]] entry as a model. Every request still runs through LASEASK's agent, MCP tools
# and prompt. Open WebUI calls http://<laseask>:8787/v1 with this api_key as its OPENAI_API_KEYS.
[openwebui]
enabled = false
# Long random secret, at least 16 characters (e.g. `openssl rand -hex 32`). Same value as
# LASEASK_API_KEY in deploy/openwebui/.env.
api_key = "REPLACE-ME-WITH-A-LONG-RANDOM-SECRET"
# false: while tools are in use, the AI's notes between tool calls go to Open WebUI's folded
# "Thought" block with the live tool timeline, and the reply shows only the final answer.
# true: everything streams into the reply as it comes.
live_answer = false
# Language of the tool timeline in the "Thought" block: "fr" or "en".
language = "fr"
# Also list one model per [providers.*] ("laseask-anthropic", "laseask-openai", "laseask-mistral",
# all tools, the provider's default_model), and accept any "<provider>/<model>" id, e.g.
# "anthropic/claude-sonnet-5-5": add such ids in Open WebUI (Admin Panel > Settings > Connections
# > the LASEASK connection > Model IDs) to pick any model, like the old console's model field.
provider_models = true

# The models Open WebUI offers. Without any [[openwebui.models]] block you get "laseask" (all
# tools) and "laseask-chat" (no tools). provider / model default to default_provider and its
# default_model; mcp_servers defaults to every [mcp.*] server plus "intel".
[[openwebui.models]]
id = "laseask"
name = "LASEASK – investigation"

[[openwebui.models]]
id = "laseask-fortianalyzer"
name = "LASEASK – FortiAnalyzer uniquement (MCP only)"
mcp_servers = ["fortianalyzer"]
mcp_only = true

# No tools, cheap model: Open WebUI's task model (titles, tags, follow-up questions, search
# queries), set as TASK_MODEL_EXTERNAL in deploy/openwebui/.env. Also fine for plain questions.
[[openwebui.models]]
id = "laseask-chat"
name = "LASEASK – chat simple (sans outils)"
tools = false
model = "claude-haiku-4-5-20251001"

# Optional: model prices in US dollars per million tokens, for the cost estimate under each reply.
# One block per model name, exactly as in default_model or the UI's model field. Models without a
# block only show token counts. cache_read / cache_write default to the input price. Check the
# providers' pricing pages: prices change.
[pricing."claude-opus-5-5"]
input = 4.0
output = 20.0
cache_read = 0.2
cache_write = 5.0

[pricing."claude-haiku-4-5-20251001"]
input = 1.0
output = 5.0
cache_read = 0.1
cache_write = 1.25

# [pricing."mistral-large-latest"]
# input = 0.0
# output = 0.0
