<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>LASEASK</title>
<link rel="stylesheet" href="style.css" />
<!-- Markdown rendering for replies. Optional: if the CDN is unreachable, replies show as plain text. -->
<script src="https://cdn.jsdelivr.net/npm/marked@12.0.2/marked.min.js" defer></script>
<script src="https://cdn.jsdelivr.net/npm/dompurify@3.1.6/dist/purify.min.js" defer></script>
</head>
<body>
<div id="app">
  <aside id="sidebar" data-i18n-aria="settings">
    <div class="sidebar-head">
      <span id="brand"><span class="brand-mark">◆</span> LASEASK <span id="version" class="tag"></span></span>
      <button id="close-sidebar" class="icon-btn only-mobile" data-i18n-aria="closeSettings">✕</button>
    </div>

    <button id="new-chat-btn" class="new-chat" data-i18n="newChat">+ New chat</button>

    <section class="panel">
      <h2 data-i18n="ai">AI</h2>
      <div id="provider-buttons" class="provider-grid" role="radiogroup" data-i18n-aria="aiProvider"></div>
      <label class="field">
        <span data-i18n="model">Model</span>
        <input id="model-input" type="text" spellcheck="false" autocomplete="off" />
      </label>
    </section>

    <section class="panel">
      <h2 data-i18n="tools">Tools (MCP)</h2>
      <div id="mcp-list" class="mcp-list"></div>
      <p id="mcp-hint" class="hint" hidden></p>
      <label id="mcp-only-label" class="switch" data-i18n-title="mcpOnlyTitle">
        <input type="checkbox" id="mcp-only-toggle" />
        <span class="switch-track"><span class="switch-thumb"></span></span>
        <span data-i18n="mcpOnly">MCP only</span>
      </label>
    </section>

    <section class="panel">
      <h2 data-i18n="conversation">Conversation</h2>
      <div id="conv-stats" class="conv-stats"></div>
      <div class="export-row">
        <button id="export-md" type="button" class="ghost-btn" data-i18n="exportMd">Export .md</button>
        <button id="export-html" type="button" class="ghost-btn" data-i18n="exportHtml">Export .html</button>
      </div>
    </section>

    <p class="sidebar-foot" data-i18n="storedLocally">Conversations are stored in this browser only.</p>
  </aside>
  <div id="backdrop" hidden></div>

  <div id="main">
    <header id="mobile-bar" class="only-mobile">
      <button id="open-sidebar" class="icon-btn" data-i18n-aria="openSettings">☰</button>
      <span id="mobile-title"></span>
    </header>

    <main id="messages">
      <div id="empty-state">
        <div class="empty-mark">◆</div>
        <h1 data-i18n="emptyTitle">How can I help?</h1>
        <p id="empty-sub"></p>
      </div>
    </main>

    <footer id="composer-wrap">
      <div id="composer">
        <span class="prompt-mark">&gt;</span>
        <textarea id="input" data-i18n-placeholder="placeholder" rows="1"></textarea>
        <button id="send-btn" class="send" data-i18n-aria="send">↑</button>
      </div>
      <div id="composer-meta"></div>
    </footer>
  </div>
</div>
<script src="app.js"></script>
</body>
</html>
