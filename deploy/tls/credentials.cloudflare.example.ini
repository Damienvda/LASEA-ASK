# Copy this file somewhere private on the server, e.g. /etc/letsencrypt/cloudflare.ini,
# fill in a real value, and: chmod 600 /etc/letsencrypt/cloudflare.ini
#
# Create a scoped API token at https://dash.cloudflare.com/profile/api-tokens with the
# "Zone.DNS: Edit" permission for the zone(s) you're requesting certs for.

dns_cloudflare_api_token = your-api-token
