# Copy this file somewhere private on the server, e.g. /etc/letsencrypt/ovh.ini,
# fill in real values, and: chmod 600 /etc/letsencrypt/ovh.ini
#
# Get these from https://api.ovh.com/createToken/ (or the OVH Manager, API keys section).
# dns_ovh_endpoint is one of: ovh-eu, ovh-ca, ovh-us (match your OVH account's region).

dns_ovh_endpoint = ovh-eu
dns_ovh_application_key = your-application-key
dns_ovh_application_secret = your-application-secret
dns_ovh_consumer_key = your-consumer-key
